openapi: 3.1.0
info:
  title: OvěřTo.AI Analysis API
  version: '1.0'
  description: Experimental, non-persistent analysis. Not a guarantee of fraud detection.
paths:
  /api/v1/analyses:
    post:
      summary: Analyze a user-reviewed message
      parameters:
        - in: header
          name: Authorization
          required: false
          description: Optional local-development test bearer key; production key authentication is not available.
          schema: { type: string }
        - in: header
          name: Idempotency-Key
          required: false
          description: UUID required when using a local test key. Replays return 409.
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, minLength: 1, maxLength: 10000 }
                locale: { type: string, enum: [cs, en], description: Overrides Accept-Language. Unsupported browser languages fall back to Czech. }
                enableLlm: { type: boolean, default: false }
                aiConsent: { type: boolean, description: Required to be true when enableLlm is true. }
      responses:
        '200':
          description: Ephemeral analysis with a versioned response and evidence graph.
          content:
            application/json:
              schema:
                type: object
                required: [schemaVersion, analysisId, status, decision, signals, evidence, actionGraph, recommendedActions, uncertainty, engine, metadata, result]
                properties:
                  schemaVersion: { const: '1.0' }
                  analysisId: { type: string, format: uuid }
                  status: { const: COMPLETED }
                  decision: { enum: [HIGH_RISK, VERIFICATION_RECOMMENDED, INSUFFICIENT_EVIDENCE] }
                  signals: { type: array, items: { type: object } }
                  evidence: { type: array, items: { type: object } }
                  actionGraph: { type: object, description: Graph v2 UTF-16 spans refer to result.sanitizedText; repeated quotes expose multiple spans and ambiguous=true. }
                  recommendedActions: { type: array, items: { type: object } }
                  uncertainty: { type: string }
                  engine: { type: object }
                  metadata: { type: object }
                  result: { type: object }
        '400': { description: Invalid input or missing AI consent. }
        '401': { description: Invalid, expired or revoked local test key. }
        '402': { description: Insufficient local test credits. }
        '408': { description: Request body was not received before the deadline. }
        '409': { description: Local request identifier already used. }
        '413': { description: Request too large. }
        '415': { description: Content-Type must be application/json. }
        '429':
          description: A process circuit breaker or shared local-account key/project/workspace rate limit was reached. Anonymous requests still have only process-local protection.
          headers:
            Retry-After:
              description: Seconds before retrying.
              schema: { type: integer, minimum: 1 }
        '500': { description: Internal processing error. }
        '503': { description: Local service unavailable. }
  /api/v1/health:
    get:
      summary: Basic service health
      responses:
        '200': { description: Service process responded. }
  /api/v1/capabilities:
    get:
      summary: Available feature types
      responses:
        '200': { description: Capabilities, excluding model connectivity. }
