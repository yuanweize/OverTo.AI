name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: overto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d overto_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LEDGER_TEST_DATABASE_URL: postgresql://postgres:test-only-password@127.0.0.1:5432/overto_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npm run build
